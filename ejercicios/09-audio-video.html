<title>09 Audio Video</title>

<body>
<h1>Ejercicio con audio y video</h1>
<h2>Audio</h2>
<audio controls>
<source src="audio.mp3" type="audio/mpeg">
Tu navegador no admite audio HTML5.
</audio>
<p>Para probar el audio, coloca un archivo llamado <strong>audio.mp3</strong> en esta carpeta.</p>
<h2>Video</h2>
<video controls width="500">
<source src="video.mp4" type="video/mp4">
Tu navegador no admite video HTML5.
</video>
<p>Para probar el video, coloca un archivo llamado <strong>video.mp4</strong> en esta carpeta.</p>
